name: Backup

# Backup semanal (E16, ADR-038): pg_dump do schema radar, comprimido e CRIPTOGRAFADO com age.
# Repositório público (ADR-014): só o arquivo .age vira artefato; a chave privada nunca está aqui.
on:
  schedule:
    - cron: "0 8 * * 0" # domingo 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      PG_CLIENT_VERSION: ${{ vars.PG_CLIENT_VERSION || '17' }}
    steps:
      - name: Conferir segredos
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_AGE_PUBLIC_KEY" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::Backup pulado: faltam os Secrets DATABASE_URL e/ou BACKUP_AGE_PUBLIC_KEY (docs/operations/runbook.md)."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Faltam os Secrets DATABASE_URL e/ou BACKUP_AGE_PUBLIC_KEY (docs/operations/runbook.md)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Instalar pg_dump (versão do servidor) e age
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_CLIENT_VERSION}" age
      - name: Gerar backup criptografado
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p backups
          PATH="/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin:$PATH" bash scripts/backup.sh backups
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: radar-backup-${{ github.run_id }}
          path: backups/*.dump.age
          retention-days: 30
          if-no-files-found: error
