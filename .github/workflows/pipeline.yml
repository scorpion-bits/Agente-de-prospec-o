name: Pipeline

# Radar diário (E16, ADR-038). Repositório público (ADR-014): logs só com contagens, segredos só em
# Secrets, nenhum arquivo com dados enviado como artefato. Rodar à mão: Actions → Pipeline → Run workflow.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular (não grava; sem digest)"
        type: boolean
        default: false
      digest:
        description: "Forçar o digest (precisa de DIGEST_EMAIL_TO e SMTP nos Secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # só para o passo que mantém o agendamento ativo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DB_SCHEMA: radar
      GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
      GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'serper' }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      COMPANY_CNPJ: ${{ secrets.COMPANY_CNPJ }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      DIGEST_BASE_URL: ${{ vars.DIGEST_BASE_URL }}
      DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      LOG_PII: "false"
    steps:
      - name: Conferir segredo obrigatório
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DJANGO_SECRET_KEY" ]; then
            # Agendado sem Secrets (P26 ainda não feito): pula com aviso em vez de falhar todo dia.
            # Disparo manual sem Secrets continua falhando, para o erro aparecer.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::Pipeline pulado: faltam os Secrets DATABASE_URL e/ou DJANGO_SECRET_KEY (docs/operations/runbook.md)."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Faltam os Secrets DATABASE_URL e/ou DJANGO_SECRET_KEY (docs/operations/runbook.md)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        if: steps.secrets.outputs.ready == 'true'
      - name: Aplicar migrations pendentes
        if: steps.secrets.outputs.ready == 'true'
        run: uv run python manage.py migrate --noinput
      - name: Pipeline
        if: steps.secrets.outputs.ready == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_DIGEST: ${{ inputs.digest }}
        run: |
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          # Digest semanal: segundas-feiras (ou forçado à mão), e só se houver destinatários
          if [ -n "$DIGEST_EMAIL_TO" ] && { [ "$(date -u +%u)" = "1" ] || [ "$FORCE_DIGEST" = "true" ]; }; then
            args="$args --digest --email"
          fi
          uv run python manage.py run_pipeline $args
      - name: Manter o agendamento ativo
        # O GitHub desliga workflows agendados após 60 dias sem atividade no repositório público.
        if: always() && github.event_name == 'schedule' && steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable" || echo "::warning::Não foi possível renovar o agendamento (veja o runbook)."
