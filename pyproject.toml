[project]
name = "radar-scorpion-bits"
version = "0.1.0"
description = "Radar comercial interno da Scorpion Bits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "radar.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["staticfiles", "docs", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
